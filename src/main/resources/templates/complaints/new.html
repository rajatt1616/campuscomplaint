<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('File Complaint')}"></head>
<body class="min-h-screen bg-page font-sans text-ink">

<nav th:replace="~{fragments/layout :: sidebar('new')}"></nav>
<header th:replace="~{fragments/layout :: mobilebar}"></header>

<main class="min-h-screen px-4 pb-8 pt-16 lg:ml-60 lg:px-8 lg:py-8">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="mx-auto max-w-[640px]">
        <div class="mb-8">
            <div class="mb-2 flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-muted">
                <span class="h-1.5 w-1.5 rounded-full bg-accent"></span>
                New Complaint
            </div>
            <h1 class="text-2xl font-bold text-ink">File a Complaint</h1>
            <div class="mt-3 h-1 w-12 rounded-full bg-accent"></div>
        </div>

        <div class="rounded-lg border border-border bg-card p-6">
            <form th:action="@{/complaints}" method="post" class="space-y-4">
                <div>
                    <label for="title" class="mb-1.5 block text-sm font-semibold text-ink">Title</label>
                    <input type="text" id="title" name="title" required minlength="8" maxlength="120"
                           th:value="${formTitle}"
                           th:classappend="${errors != null and errors['title'] != null} ? 'border-danger'"
                           placeholder="Short summary of the issue"
                           class="h-10 w-full rounded-md border border-border px-3 text-base text-ink placeholder:text-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30">
                    <div th:if="${errors != null and errors['title'] != null}"
                         class="mt-1.5 text-xs font-semibold text-danger"
                         th:text="${errors['title']}">Title error</div>
                </div>

                <div class="grid grid-cols-1 gap-4 sm:grid-cols-2">
                    <div>
                        <label for="category" class="mb-1.5 block text-sm font-semibold text-ink">Category</label>
                        <select id="category" name="category" required
                                class="h-10 w-full rounded-md border border-border bg-card px-3 text-base text-ink focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30">
                            <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.label}"
                                    th:selected="${formCategory != null and formCategory == cat}">Mess</option>
                        </select>
                    </div>
                    <div>
                        <label for="priority" class="mb-1.5 block text-sm font-semibold text-ink">Priority</label>
                        <select id="priority" name="priority" required
                                class="h-10 w-full rounded-md border border-border bg-card px-3 text-base text-ink focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30">
                            <option th:each="p : ${priorities}" th:value="${p}" th:text="${p.label}"
                                    th:selected="${formPriority != null and formPriority == p}">Medium</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label for="description" class="mb-1.5 block text-sm font-semibold text-ink">Description</label>
                    <textarea id="description" name="description" required rows="5" minlength="20"
                              th:classappend="${errors != null and errors['description'] != null} ? 'border-danger'"
                              placeholder="What happened, where, and when"
                              class="w-full rounded-md border border-border px-3 py-2 text-base text-ink placeholder:text-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30"
                              th:text="${formDescription}"></textarea>
                    <div th:if="${errors != null and errors['description'] != null}"
                         class="mt-1.5 text-xs font-semibold text-danger"
                         th:text="${errors['description']}">Description error</div>
                </div>

                <div class="flex justify-end gap-3 pt-2">
                    <a href="/"
                       class="inline-flex h-10 items-center rounded-lg border border-border px-4 text-sm font-semibold text-ink transition hover:bg-page">Cancel</a>
                    <button type="submit"
                            class="h-10 rounded-lg bg-primary px-4 text-sm font-semibold text-white transition hover:bg-primary-hover">Submit Complaint</button>
                </div>
            </form>
        </div>
    </div>
</main>

</body>
</html>
