<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Search')}"></head>
<body class="min-h-screen bg-page font-sans text-ink">

<nav th:replace="~{fragments/layout :: sidebar('search')}"></nav>

<main class="ml-60 min-h-screen px-8 py-8">
    <div th:replace="~{fragments/layout :: flash}"></div>

    <div class="mb-8">
        <div class="mb-2 flex items-center gap-2 text-xs font-semibold uppercase tracking-wider text-muted">
            <span class="h-1.5 w-1.5 rounded-full bg-accent"></span>
            Search
        </div>
        <h1 class="text-2xl font-bold text-ink">Find Complaints</h1>
        <div class="mt-3 h-1 w-12 rounded-full bg-accent"></div>
    </div>

    <form th:action="@{/search}" method="get" class="mb-6 rounded-lg border border-border bg-card p-4">
        <div class="flex items-end gap-3">
            <div class="flex-1">
                <label for="keyword" class="mb-1.5 block text-sm font-semibold text-ink">Keyword</label>
                <input type="text" id="keyword" name="keyword" th:value="${keyword}"
                       placeholder="ID, title or description"
                       class="h-10 w-full rounded-md border border-border px-3 text-base text-ink placeholder:text-muted focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30">
            </div>
            <div>
                <label for="status" class="mb-1.5 block text-sm font-semibold text-ink">Status</label>
                <select id="status" name="status"
                        class="h-10 rounded-md border border-border bg-card px-3 text-base text-ink focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30">
                    <option value="">Any status</option>
                    <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"
                            th:selected="${s == selectedStatus}">Filed</option>
                </select>
            </div>
            <div>
                <label for="category" class="mb-1.5 block text-sm font-semibold text-ink">Category</label>
                <select id="category" name="category"
                        class="h-10 rounded-md border border-border bg-card px-3 text-base text-ink focus:border-primary focus:outline-none focus:ring-2 focus:ring-primary/30">
                    <option value="">Any category</option>
                    <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat.label}"
                            th:selected="${cat == selectedCategory}">Mess</option>
                </select>
            </div>
            <button type="submit"
                    class="h-10 rounded-lg bg-primary px-4 text-sm font-semibold text-white transition hover:bg-primary-hover">Filter</button>
        </div>
    </form>

    <div class="overflow-hidden rounded-lg border border-border bg-card">
        <table class="w-full text-left text-sm">
            <thead>
            <tr class="border-b border-border">
                <th class="px-6 py-3 text-xs font-semibold uppercase tracking-wide text-muted">ID</th>
                <th class="px-6 py-3 text-xs font-semibold uppercase tracking-wide text-muted">Title</th>
                <th class="px-6 py-3 text-xs font-semibold uppercase tracking-wide text-muted">Filed by</th>
                <th class="px-6 py-3 text-xs font-semibold uppercase tracking-wide text-muted">Category</th>
                <th class="px-6 py-3 text-xs font-semibold uppercase tracking-wide text-muted">Status</th>
                <th class="px-6 py-3 text-xs font-semibold uppercase tracking-wide text-muted">Updated</th>
                <th class="px-6 py-3"></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${results}" class="border-b border-border transition last:border-0 hover:bg-surface">
                <td class="px-6 py-3 font-semibold text-primary" th:text="${c.id}">CMP-0001</td>
                <td class="max-w-[280px] truncate px-6 py-3 font-medium text-ink" th:text="${c.title}">Title</td>
                <td class="px-6 py-3 text-muted" th:text="${c.createdByName}">Name</td>
                <td class="px-6 py-3 text-muted" th:text="${c.category.label}">Mess</td>
                <td class="px-6 py-3">
                    <span th:replace="~{fragments/layout :: badge(${c.status})}">Filed</span>
                </td>
                <td class="px-6 py-3 text-muted" th:text="${fmt.shortDate(c.updatedAt)}">01 Jan</td>
                <td class="px-6 py-3 text-right">
                    <a th:href="@{'/complaints/' + ${c.id}}"
                       class="rounded-lg border border-border px-3 py-1.5 text-xs font-semibold text-ink transition hover:bg-page">View</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(results)}">
                <td colspan="7" class="px-6 py-12 text-center text-base text-muted">Nothing here yet.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>

</body>
</html>
