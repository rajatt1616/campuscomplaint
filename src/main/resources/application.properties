spring.application.name=CampusComplaint
# Bind to $PORT when provided (Render/hosts), fall back to 8080 locally
server.port=${PORT:8080}

# File-based persistence
app.data.dir=./data

# Deadlines (hidden config — never shown in PPT)
app.deadline.auto-close=P3D
app.deadline.reopen=P2D

# Thymeleaf template caching (override locally with SPRING_THEMLEAF_CACHE=false)
spring.thymeleaf.cache=true

# Session hardening: cookie-only tracking (no ;jsessionid URLs), SameSite strict
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.http-only=true

# Never expose stack traces / internal messages in error responses
server.error.include-stacktrace=never
server.error.include-exception=false

# Scheduled deadline checker (every 5 minutes)
app.deadline.check-interval=PT5M
